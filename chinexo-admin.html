<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chinexo Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --navy: #0F1B3D;
  --blue: #2368FE;
  --green: #22C55E;
  --red: #EF4444;
  --amber: #F59E0B;
  --light: #F3F5F9;
  --border: rgba(255,255,255,0.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--navy);
  min-height: 100vh;
  color: white;
}

/* LOGIN */
#loginScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: var(--navy);
  position: relative;
  overflow: hidden;
}
#loginScreen::before {
  content: '';
  position: absolute;
  top: -100px; right: -100px;
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(35,104,254,0.25) 0%, transparent 70%);
  border-radius: 50%;
}
#loginScreen::after {
  content: '';
  position: absolute;
  bottom: -80px; left: -80px;
  width: 250px; height: 250px;
  background: radial-gradient(circle, rgba(34,197,94,0.15) 0%, transparent 70%);
  border-radius: 50%;
}
.login-box {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 32px 24px;
  width: 100%;
  max-width: 360px;
  backdrop-filter: blur(10px);
  position: relative;
  z-index: 1;
}
.login-logo {
  text-align: center;
  margin-bottom: 28px;
}
.login-logo h1 {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  color: white;
}
.login-logo p {
  font-size: 11px;
  color: rgba(255,255,255,0.4);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-top: 4px;
}
.field-label {
  font-size: 11px;
  font-weight: 700;
  color: rgba(255,255,255,0.5);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 6px;
  display: block;
}
.field-input {
  width: 100%;
  padding: 13px 16px;
  background: rgba(255,255,255,0.08);
  border: 1.5px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  font-size: 14px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  color: white;
  outline: none;
  margin-bottom: 16px;
  transition: border 0.2s;
}
.field-input:focus { border-color: var(--blue); }
.field-input::placeholder { color: rgba(255,255,255,0.25); }
.login-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--blue), #1a52d4);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  font-family: 'Plus Jakarta Sans', sans-serif;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(35,104,254,0.35);
}
.login-btn:active { opacity: 0.85; }
.login-error {
  background: rgba(239,68,68,0.15);
  border: 1px solid rgba(239,68,68,0.3);
  color: #fca5a5;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13px;
  margin-top: 12px;
  display: none;
}

/* ADMIN PANEL */
#adminScreen { display: none; padding: 0 0 40px; }

.admin-top {
  background: rgba(255,255,255,0.04);
  border-bottom: 1px solid var(--border);
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(10px);
}
.admin-top h1 {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
}
.admin-top h1 span { color: var(--green); }
.logout-btn {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.7);
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 12px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  cursor: pointer;
}

.admin-body { padding: 16px; }

/* PLATFORM SUMMARY */
.summary-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 24px;
}
.summary-card {
  border-radius: 14px;
  padding: 16px;
  text-align: center;
}
.summary-card.blue { background: rgba(35,104,254,0.15); border: 1px solid rgba(35,104,254,0.25); }
.summary-card.green { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.25); }
.summary-card.red { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.25); }
.summary-card.amber { background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.25); }
.summary-val {
  font-size: 26px;
  font-weight: 800;
  line-height: 1;
}
.summary-card.blue .summary-val { color: #60a5fa; }
.summary-card.green .summary-val { color: #4ade80; }
.summary-card.red .summary-val { color: #f87171; }
.summary-card.amber .summary-val { color: #fbbf24; }
.summary-lbl {
  font-size: 10px;
  color: rgba(255,255,255,0.4);
  margin-top: 5px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* SECTION HEADER */
.section-hdr {
  font-size: 11px;
  font-weight: 700;
  color: rgba(255,255,255,0.4);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
}

/* SCHOOL CARD */
.school-card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
  transition: background 0.2s;
}
.school-card:active { background: rgba(255,255,255,0.08); }
.school-name {
  font-size: 16px;
  font-weight: 700;
  color: white;
  margin-bottom: 3px;
}
.school-meta {
  font-size: 11px;
  color: rgba(255,255,255,0.4);
  line-height: 1.5;
  margin-bottom: 12px;
}
.stats-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.stat-box {
  border-radius: 10px;
  padding: 10px 8px;
  text-align: center;
}
.stat-box.neutral { background: rgba(255,255,255,0.07); }
.stat-box.g { background: rgba(34,197,94,0.12); }
.stat-box.r { background: rgba(239,68,68,0.12); }
.stat-val {
  font-size: 15px;
  font-weight: 800;
  line-height: 1;
}
.stat-box.neutral .stat-val { color: white; }
.stat-box.g .stat-val { color: #4ade80; }
.stat-box.r .stat-val { color: #f87171; }
.stat-lbl {
  font-size: 9px;
  color: rgba(255,255,255,0.4);
  margin-top: 3px;
  text-transform: uppercase;
}

/* PROGRESS BAR */
.prog-header {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: rgba(255,255,255,0.4);
  margin-bottom: 6px;
}
.prog-pct { font-weight: 700; }
.prog-track {
  height: 5px;
  background: rgba(255,255,255,0.08);
  border-radius: 5px;
  overflow: hidden;
}
.prog-fill {
  height: 100%;
  border-radius: 5px;
  transition: width 0.8s ease;
}

.school-footer {
  font-size: 10px;
  color: rgba(255,255,255,0.25);
  margin-top: 10px;
}

/* LOADER */
.loader-wrap {
  text-align: center;
  padding: 48px 20px;
  color: rgba(255,255,255,0.4);
  font-size: 14px;
}
.spinner {
  width: 36px; height: 36px;
  border: 3px solid rgba(255,255,255,0.1);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* EMPTY */
.empty { text-align: center; padding: 48px 20px; color: rgba(255,255,255,0.4); font-size: 14px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <h1>Chinexo</h1>
      <p>Admin Panel</p>
    </div>
    <label class="field-label">Admin Password</label>
    <input class="field-input" type="password" id="adminPassInput" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')doAdminLogin()">
    <button class="login-btn" onclick="doAdminLogin()">Access Admin Panel →</button>
    <div class="login-error" id="loginErr">Incorrect password. Try again.</div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminScreen">
  <div class="admin-top">
    <h1>Chinexo <span>Admin</span></h1>
    <button class="logout-btn" onclick="doLogout()">← Back</button>
  </div>
  <div class="admin-body">
    <div id="adminContent">
      <div class="loader-wrap"><div class="spinner"></div>Loading...</div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://lvjzvevfwlrnaoefhoeg.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2anp2ZXZmd2xybmFvZWZob2VnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MTY2MTMsImV4cCI6MjA5NTE5MjYxM30.uV3Me_GLFflq-pLCwg9CDIVO68y0sVXn3HNBtBLUe6M';
const ADMIN_PASSWORD = 'chinexo2024'; // ← CHANGE THIS to your real admin password

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function doAdminLogin() {
  const pass = document.getElementById('adminPassInput').value.trim();
  const errEl = document.getElementById('loginErr');
  if (pass === ADMIN_PASSWORD) {
    errEl.style.display = 'none';
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminScreen').style.display = 'block';
    loadAdminPanel();
  } else {
    errEl.style.display = 'block';
  }
}

function doLogout() {
  document.getElementById('adminScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('adminPassInput').value = '';
}

async function loadAdminPanel() {
  const el = document.getElementById('adminContent');
  el.innerHTML = '<div class="loader-wrap"><div class="spinner"></div>Loading schools...</div>';

  try {
    // Load all three tables in parallel
    const [schoolsRes, studentsRes, paymentsRes] = await Promise.all([
      db.from('schools').select('id,name,address,admin_phone,created_at,default_fee,term,session').order('created_at', { ascending: false }),
      db.from('students').select('school_id,fee'),
      db.from('payments').select('school_id,amount')
    ]);

    if (schoolsRes.error) throw schoolsRes.error;
    if (studentsRes.error) throw studentsRes.error;
    if (paymentsRes.error) throw paymentsRes.error;

    const schools = schoolsRes.data || [];
    const students = studentsRes.data || [];
    const payments = paymentsRes.data || [];

    // Build maps
    const studentCountMap = {};
    const expectedFeeMap = {};
    students.forEach(s => {
      studentCountMap[s.school_id] = (studentCountMap[s.school_id] || 0) + 1;
      expectedFeeMap[s.school_id] = (expectedFeeMap[s.school_id] || 0) + (parseFloat(s.fee) || 0);
    });

    const collectedMap = {};
    payments.forEach(p => {
      collectedMap[p.school_id] = (collectedMap[p.school_id] || 0) + (parseFloat(p.amount) || 0);
    });

    // Platform totals
    const totalStudents = Object.values(studentCountMap).reduce((a, b) => a + b, 0);
    const totalCollected = Object.values(collectedMap).reduce((a, b) => a + b, 0);
    const totalExpected = Object.values(expectedFeeMap).reduce((a, b) => a + b, 0);
    const totalOutstanding = Math.max(0, totalExpected - totalCollected);

    // Format naira
    const fmt = n => '₦' + Number(n).toLocaleString('en-NG');

    // Platform summary
    let html = `
      <div class="section-hdr">Platform Overview</div>
      <div class="summary-grid">
        <div class="summary-card blue">
          <div class="summary-val">${schools.length}</div>
          <div class="summary-lbl">Schools</div>
        </div>
        <div class="summary-card green">
          <div class="summary-val">${totalStudents}</div>
          <div class="summary-lbl">Students</div>
        </div>
        <div class="summary-card green">
          <div class="summary-val" style="font-size:18px">${fmt(totalCollected)}</div>
          <div class="summary-lbl">Total Collected</div>
        </div>
        <div class="summary-card red">
          <div class="summary-val" style="font-size:18px">${fmt(totalOutstanding)}</div>
          <div class="summary-lbl">Outstanding</div>
        </div>
      </div>

      <div class="section-hdr">${schools.length} Registered School${schools.length !== 1 ? 's' : ''}</div>
    `;

    if (schools.length === 0) {
      html += '<div class="empty">No schools registered yet.</div>';
    } else {
      schools.forEach(school => {
        const count = studentCountMap[school.id] || 0;
        const collected = collectedMap[school.id] || 0;
        const expected = expectedFeeMap[school.id] || 0;
        const outstanding = Math.max(0, expected - collected);
        const pct = expected > 0 ? Math.min(100, Math.round((collected / expected) * 100)) : 0;
        const barColor = pct >= 75 ? '#22c55e' : pct >= 40 ? '#f59e0b' : '#ef4444';
        const pctColor = pct >= 75 ? '#4ade80' : pct >= 40 ? '#fbbf24' : '#f87171';
        const joined = new Date(school.created_at).toLocaleDateString('en-NG', { day: 'numeric', month: 'short', year: 'numeric' });

        html += `
          <div class="school-card">
            <div class="school-name">${school.name}</div>
            <div class="school-meta">
              ${school.address || '—'}<br>
              📞 ${school.admin_phone || '—'} &nbsp;·&nbsp; ${school.term || ''} ${school.session || ''}
            </div>
            <div class="stats-row">
              <div class="stat-box neutral">
                <div class="stat-val">${count}</div>
                <div class="stat-lbl">Students</div>
              </div>
              <div class="stat-box g">
                <div class="stat-val" style="font-size:12px">${fmt(collected)}</div>
                <div class="stat-lbl">Collected</div>
              </div>
              <div class="stat-box r">
                <div class="stat-val" style="font-size:12px">${fmt(outstanding)}</div>
                <div class="stat-lbl">Owing</div>
              </div>
            </div>
            <div class="prog-header">
              <span>Fee Collection Rate</span>
              <span class="prog-pct" style="color:${pctColor}">${pct}%</span>
            </div>
            <div class="prog-track">
              <div class="prog-fill" style="width:${pct}%;background:${barColor}"></div>
            </div>
            <div class="school-footer">Joined ${joined} &nbsp;·&nbsp; Default fee ${fmt(school.default_fee || 0)}</div>
            <button onclick="confirmDeleteSchool('${school.id}', '${school.name}')" style="margin-top:12px;width:100%;padding:10px;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);color:#f87171;border-radius:10px;font-size:13px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;">🗑 Delete School</button>
          </div>
        `;
      });
    }

    el.innerHTML = html;

  } catch (err) {
    el.innerHTML = `<div class="empty" style="color:#f87171">Error loading data:<br>${err.message}</div>`;
  }
}
</script>
</body>
</html>
<script>
// Delete school feature - appended
const _origDeleteSchool = window.confirmDeleteSchool;

window.confirmDeleteSchool = function(id, name) {
  const confirmed = confirm('Delete "' + name + '"?\n\nThis will permanently remove the school, all its students and payments. Cannot be undone.');
  if (confirmed) window.deleteSchool(id, name);
};

window.deleteSchool = async function(id, name) {
  try {
    await db.from('payments').delete().eq('school_id', id);
    await db.from('students').delete().eq('school_id', id);
    const { error } = await db.from('schools').delete().eq('id', id);
    if (error) throw error;
    const toast = document.createElement('div');
    toast.textContent = '✓ ' + name + ' deleted';
    toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#16a34a;color:white;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:700;z-index:999;font-family:Plus Jakarta Sans,sans-serif;box-shadow:0 4px 20px rgba(0,0,0,0.3)';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
    loadAdminPanel();
  } catch (err) {
    alert('Error: ' + err.message);
  }
};
</script>
